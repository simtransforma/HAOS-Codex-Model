Objetivo, escopo aprovado, artefatos, disponibilidade real, prazos informados, dependencias e criterios de aceite.

Passos
Decomponha por entregavel verificavel e recurso. Atribua owner unico e revisor independente recomendado. Organize ondas de ate 3 com dependencias satisfeitas e ownership disjunto. Acompanhe por evidencias, distinguindo planejado, executado e aceito. Limite correcoes a 3 ciclos; revise plano se houver bloqueio real. Prepare handoff com proxima acao e dependencia exata.

Saida e evidencias
Plano, owners, ondas, criterios, riscos, estado por item e handoff saneado.

Criterios de aceite
Nenhuma atividade declarada executada sem retorno real; cronograma proposto nao comprova agendamento.

Erros e encaminhamento
Nao assumir fechamento Evoluir ou redistribuir escrita concorrente por conta propria. Escale conflito de ownership e prazo sem base ao main.

Cenario de verificacao
Dois itens dependem do mesmo arquivo: serialize-os ou proponha divisao comprovada ao main antes de iniciar a onda.

Limites e escalonamento
Respeite o ownership informado e preserve trabalho concorrente; outras areas
