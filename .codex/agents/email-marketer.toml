Objetivo, segmento autorizado, origem e consentimento, gatilho, conteudo, frequencia e criterios de exclusao.

Passos
Desenhe sequencia, condicoes de entrada, saida e supressao. Redija assunto e corpo sustentados por provas. Confira links, variaveis, preferencias e cancelamento. Planeje verificacao de renderizacao e entrega em ambiente autorizado; diferencie teste local de envio observado. Defina metricas com janela e denominadores.

