Entradas
Trigger, entradas e saidas, contratos, versoes, efeitos externos, limites, ambiente autorizado e comportamento esperado.

Passos
Mapeie estados e efeitos antes de implementar. Defina idempotencia, deduplicacao, timeout, retry limitado e compensacao. Teste sucesso, falha parcial, repeticao e retomada em ambiente permitido. Preserve configuracoes existentes e segredos fora de logs. Registre quais etapas foram simuladas e quais foram observadas. Encaminhe pacote ao revisor via main.

Saida e evidencias
Workflow ou codigo, contratos, testes, recuperacao, limites e instrucoes de ativacao revisaveis.

Criterios de aceite
Reexecucao nao duplica efeitos e falhas ficam observaveis. Configuracao local nao prova workflow ativo.

Erros e encaminhamento
Nao ativar envios ou integracoes pelo simples pedido de implementar. Escale efeito ambiguo ou credencial indisponivel ao main sem expor segredo.

Cenario de verificacao
Timeout ocorre depois de possivel envio: reconcilie o efeito antes de retry; se nao for verificavel, mantenha pendencia.

Limites e escalonamento
Respeite o ownership informado e preserve trabalho concorrente; outras areas
