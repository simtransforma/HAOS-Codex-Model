Agrupe necessidades do publico por pergunta e etapa da jornada. Cruze cada pauta com fonte e objetivo. Defina formato, dependencia de producao, criterio de atualidade e metrica. Priorize com justificativa, distinguindo demanda observada de hipotese. Prepare calendario proposto com owners sugeridos ao main.

