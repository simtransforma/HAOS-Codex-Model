name: Validate Public Model

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.14']
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install Validator Dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-validator.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate Routing Metadata
        run: python -B scripts/model_routing.py
      - name: Unit Tests
        run: python -B -m unittest discover -s tests -v
      - name: Validate Checkout
        run: python -B scripts/validate_model.py
